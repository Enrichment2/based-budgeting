<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Based Budgeting</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Based Budget">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-card: #252525;
      --text: #e8e8e8;
      --text-muted: #9a9a9a;
      --accent: #4eca8b;
      --accent-light: #2a3d33;
      --danger: #e85c4a;
      --danger-light: #3d2a28;
      --warning: #e8a94a;
      --warning-light: #3d3428;
      --border: #3a3a3a;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
      --radius: 12px;
    }
    
    [data-theme="light"] {
      --bg: #f7f5f0;
      --bg-card: #fffefa;
      --text: #2c2c2c;
      --text-muted: #6b6b6b;
      --accent: #1a5f4a;
      --accent-light: #e8f3ef;
      --danger: #c44536;
      --danger-light: #fceae8;
      --warning: #d4860b;
      --warning-light: #fef6e6;
      --border: #e0ddd5;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      line-height: 1.3;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 4px;
    }

    .header .date {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .budget-display {
      text-align: center;
      padding: 20px;
    }

    .budget-amount {
      font-family: 'Fraunces', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
    }

    .budget-amount.over {
      color: var(--danger);
    }

    .budget-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin: 16px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-fill.warning {
      background: var(--warning);
    }

    .progress-fill.danger {
      background: var(--danger);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-label {
      color: var(--text-muted);
    }

    .stats-value {
      font-weight: 500;
    }

    .stats-value.positive {
      color: var(--accent);
    }

    .stats-value.negative {
      color: var(--danger);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #154d3c;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .btn-block {
      width: 100%;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-group .btn {
      flex: 1;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s ease;
    }

    .form-group input:focus, .form-group select:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .form-group input::placeholder, input::placeholder {
      color: var(--text-muted);
    }

    .form-group input[type="number"], input[type="number"] {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    select option {
      background: var(--bg-card);
      color: var(--text);
    }
    
    input[type="date"] {
      color-scheme: dark;
    }
    
    [data-theme="light"] input[type="date"] {
      color-scheme: light;
    }

    .input-prefix {
      position: relative;
    }

    .input-prefix::before {
      content: '$';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      color: var(--text-muted);
    }

    .input-prefix input {
      padding-left: 36px;
    }

    .input-suffix {
      position: relative;
    }

    .input-suffix::after {
      content: '%';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
    }

    .input-suffix input {
      padding-right: 36px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .list-item-info {
      flex: 1;
    }

    .list-item-name {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .list-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .list-item-amount {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .list-item-actions {
      display: flex;
      gap: 8px;
      margin-left: 12px;
    }

    .list-item-actions button {
      padding: 6px 10px;
      font-size: 0.75rem;
    }

    .expense-category {
      display: inline-block;
      padding: 2px 8px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .alert-warning {
      background: var(--warning-light);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .alert-danger {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .alert-success {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: transparent;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--bg-card);
      box-shadow: var(--shadow);
    }

    .hidden {
      display: none !important;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
    }

    .step-dot.active {
      background: var(--accent);
    }

    .step-dot.completed {
      background: var(--accent);
      opacity: 0.5;
    }

    .summary-box {
      background: var(--accent-light);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }

    .summary-box h4 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .summary-box .amount {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .week-nav button {
      padding: 8px 12px;
    }

    .week-nav .week-label {
      font-weight: 500;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 20px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state p {
      margin-bottom: 16px;
    }

    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-around;
    }

    .nav-bottom button {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-bottom button.active {
      color: var(--accent);
    }

    .nav-bottom button svg {
      width: 24px;
      height: 24px;
    }

    .container.has-nav {
      padding-bottom: 100px;
    }

    .inline-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inline-form input {
      width: 100%;
    }

    .inline-form-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .inline-form-row .input-prefix {
      flex: 1;
    }

    .inline-form-row button {
      flex-shrink: 0;
      height: 48px;
    }

    .savings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .savings-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .savings-card .name {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .savings-card .balance {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
    }

    .loan-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .loan-card .loan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .loan-card .loan-name {
      font-weight: 500;
    }

    .loan-card .loan-balance {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--danger);
    }

    .loan-card .loan-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .container {
        padding: 16px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .budget-amount {
        font-size: 2.5rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .savings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container has-nav" id="app">
    <!-- Content will be rendered by JavaScript -->
  </div>

  <nav class="nav-bottom hidden" id="nav">
    <button data-view="dashboard" class="active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </button>
    <button data-view="expenses">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Expenses
    </button>
    <button data-view="savings">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      Savings
    </button>
    <button data-view="settings">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </button>
  </nav>

  <script>
    // ==================== DATA MANAGEMENT ====================
    const STORAGE_KEY = 'budgetAppData';
    
    const defaultData = {
      initialized: false,
      checking: 0,
      originalSpendable: 0, // The original amount available for spending (doesn't change with expenses)
      paycheck: 0,
      paycheckDate: null,
      nextPayday: null,
      savingsCategories: [],
      loans: [],
      payments: [],
      expenses: [],
      expenseCategories: ['Dining Out', 'Groceries', 'Gas', 'Technology', 'Car', 'Entertainment', 'Shopping', 'Other'],
      weeklyBudgets: [],
      extraIncome: [],
      emergencyBuffer: 100
    };

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        return { ...defaultData, ...JSON.parse(stored) };
      }
      return { ...defaultData };
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let appData = loadData();

    // ==================== US FEDERAL HOLIDAYS ====================
    function getUSHolidays(year) {
      const holidays = [];
      
      // New Year's Day - Jan 1
      holidays.push(new Date(year, 0, 1));
      
      // MLK Day - 3rd Monday of January
      holidays.push(getNthWeekdayOfMonth(year, 0, 1, 3));
      
      // Presidents Day - 3rd Monday of February
      holidays.push(getNthWeekdayOfMonth(year, 1, 1, 3));
      
      // Memorial Day - Last Monday of May
      holidays.push(getLastWeekdayOfMonth(year, 4, 1));
      
      // Juneteenth - June 19
      holidays.push(new Date(year, 5, 19));
      
      // Independence Day - July 4
      holidays.push(new Date(year, 6, 4));
      
      // Labor Day - 1st Monday of September
      holidays.push(getNthWeekdayOfMonth(year, 8, 1, 1));
      
      // Columbus Day - 2nd Monday of October
      holidays.push(getNthWeekdayOfMonth(year, 9, 1, 2));
      
      // Veterans Day - November 11
      holidays.push(new Date(year, 10, 11));
      
      // Thanksgiving - 4th Thursday of November
      holidays.push(getNthWeekdayOfMonth(year, 10, 4, 4));
      
      // Christmas - December 25
      holidays.push(new Date(year, 11, 25));
      
      return holidays;
    }

    function getNthWeekdayOfMonth(year, month, weekday, n) {
      const first = new Date(year, month, 1);
      let dayOfWeek = first.getDay();
      let diff = weekday - dayOfWeek;
      if (diff < 0) diff += 7;
      return new Date(year, month, 1 + diff + (n - 1) * 7);
    }

    function getLastWeekdayOfMonth(year, month, weekday) {
      const last = new Date(year, month + 1, 0);
      let dayOfWeek = last.getDay();
      let diff = dayOfWeek - weekday;
      if (diff < 0) diff += 7;
      return new Date(year, month + 1, -diff);
    }

    function isHoliday(date) {
      const holidays = getUSHolidays(date.getFullYear());
      return holidays.some(h => 
        h.getDate() === date.getDate() && 
        h.getMonth() === date.getMonth() && 
        h.getFullYear() === date.getFullYear()
      );
    }

    function isWorkday(date) {
      const day = date.getDay();
      return day !== 0 && day !== 6 && !isHoliday(date);
    }

    function getLastWorkdayOfMonth(year, month) {
      let date = new Date(year, month + 1, 0);
      while (!isWorkday(date)) {
        date.setDate(date.getDate() - 1);
      }
      return date;
    }

    function getNextPayday(fromDate = new Date()) {
      let year = fromDate.getFullYear();
      let month = fromDate.getMonth();
      let lastWorkday = getLastWorkdayOfMonth(year, month);
      
      if (fromDate > lastWorkday) {
        month++;
        if (month > 11) {
          month = 0;
          year++;
        }
        lastWorkday = getLastWorkdayOfMonth(year, month);
      }
      
      return lastWorkday;
    }

    function isPayday(date = new Date()) {
      const lastWorkday = getLastWorkdayOfMonth(date.getFullYear(), date.getMonth());
      return date.toDateString() === lastWorkday.toDateString();
    }

    // ==================== WEEK CALCULATIONS ====================
    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getWeekEnd(date) {
      const start = getWeekStart(date);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      end.setHours(23, 59, 59, 999);
      return end;
    }

    function getWeeksBetween(startDate, endDate) {
      const weeks = [];
      let current = getWeekStart(startDate);
      const end = endDate;
      
      while (current <= end) {
        const weekEnd = getWeekEnd(current);
        weeks.push({
          start: new Date(current),
          end: weekEnd > end ? new Date(end) : weekEnd
        });
        current.setDate(current.getDate() + 7);
      }
      
      return weeks;
    }

    function getCurrentWeekIndex() {
      if (!appData.paycheckDate) return 0;
      const paycheckDate = new Date(appData.paycheckDate);
      const now = new Date();
      const weeks = getWeeksBetween(paycheckDate, new Date(appData.nextPayday));
      
      for (let i = 0; i < weeks.length; i++) {
        if (now >= weeks[i].start && now <= weeks[i].end) {
          return i;
        }
      }
      return 0;
    }

    // ==================== BUDGET CALCULATIONS ====================
    function calculateWeeklyBudgets() {
      if (!appData.paycheckDate || !appData.nextPayday) return [];
      
      const paycheckDate = new Date(appData.paycheckDate);
      const nextPayday = new Date(appData.nextPayday);
      const weeks = getWeeksBetween(paycheckDate, nextPayday);
      
      if (weeks.length === 0) return [];
      
      // Calculate base spendable amount (before any expenses)
      let baseSpendable;
      
      if (appData.paycheck > 0) {
        // Fresh paycheck flow: calculate from paycheck
        baseSpendable = appData.paycheck;
        
        // Subtract savings
        appData.savingsCategories.forEach(cat => {
          baseSpendable -= (cat.percentage / 100) * appData.paycheck;
        });
        
        // Subtract payments
        appData.payments.forEach(payment => {
          baseSpendable -= payment.amount;
        });
        
        // Subtract emergency buffer
        baseSpendable -= appData.emergencyBuffer;
      } else {
        // Mid-month flow: use originalSpendable (what user entered at setup)
        baseSpendable = (appData.originalSpendable || appData.checking) - appData.emergencyBuffer;
      }
      
      // Get total extra income (adds to spendable pool)
      const totalExtraIncome = appData.extraIncome.reduce((sum, e) => sum + e.amount, 0);
      
      // Total available = base + extra income
      const totalAvailable = baseSpendable + totalExtraIncome;
      
      // Calculate base weekly budget
      const baseWeeklyBudget = totalAvailable / weeks.length;
      
      // Get expenses per week (only non-savings expenses)
      const expensesByWeek = weeks.map((week) => {
        return appData.expenses
          .filter(e => {
            const expDate = new Date(e.date);
            return expDate >= week.start && expDate <= week.end && !e.fromSavings;
          })
          .reduce((sum, e) => sum + e.amount, 0);
      });
      
      // Get total spent so far
      const totalSpent = expensesByWeek.reduce((sum, e) => sum + e, 0);
      
      // Calculate what's left to distribute over remaining weeks
      const currentWeekIndex = getCurrentWeekIndex();
      const remainingWeeks = weeks.length - currentWeekIndex;
      
      // Amount remaining = total available - everything spent so far
      const amountRemaining = totalAvailable - totalSpent;
      
      // Budget for current + future weeks (evenly distributed)
      const adjustedWeeklyBudget = remainingWeeks > 0 ? amountRemaining / remainingWeeks : 0;
      
      return weeks.map((week, index) => {
        let budget;
        
        if (index < currentWeekIndex) {
          // Past weeks: show what the budget WAS (base weekly)
          budget = baseWeeklyBudget;
        } else {
          // Current and future weeks: show adjusted budget
          budget = adjustedWeeklyBudget;
        }
        
        const spent = expensesByWeek[index];
        
        return {
          start: week.start,
          end: week.end,
          budget: Math.max(0, budget),
          spent: spent,
          remaining: budget - spent
        };
      });
    }

      if (setupMode === 'midmonth') {
        if (setupStep === 2) {
          const spendable = parseFloat(document.getElementById('setup-spendable').value) || 0;
          const nextPayday = document.getElementById('setup-next-payday').value;
          
          if (!nextPayday) {
            alert('Please select your next payday');
            return;
          }
          
          appData.checking = spendable;
          appData.originalSpendable = spendable; // Store original for budget calculations
          appData.nextPayday = new Date(nextPayday + 'T23:59:59').toISOString();
          appData.paycheckDate = new Date().toISOString();
          saveData(appData);
        }
      } else if (setupMode === 'fresh') {
        if (setupStep === 2) {
          const paycheck = parseFloat(document.getElementById('setup-paycheck').value) || 0;
          if (paycheck <= 0) {
            alert('Please enter your paycheck amount');
            return;
          }
          appData.paycheck = paycheck;
          saveData(appData);
        } else if (setupStep === 3) {
          // Save savings percentages
          document.querySelectorAll('.savings-percent-input').forEach(input => {
            const index = parseInt(input.dataset.index);
            appData.savingsCategories[index].percentage = parseFloat(input.value) || 0;
          });
          saveData(appData);
        }
      }
      
      setupStep++;
      render();
    }

      const balance = parseFloat(document.getElementById('new-savings-balance').value) || 0;
      
      if (!name) return;
      
      appData.savingsCategories.push({ name, balance, percentage: 0 });
      saveData(appData);
      render();
    }

    function removeSavingsCategory(index) {
      appData.savingsCategories.splice(index, 1);
      saveData(appData);
      render();
    }
    
    function addSetupPayment() {
      const name = document.getElementById('new-payment-name').value.trim();
      const amount = parseFloat(document.getElementById('new-payment-amount').value) || 0;
      const loanSelect = document.getElementById('new-payment-loan');
      const linkedLoan = loanSelect ? (loanSelect.value !== '' ? parseInt(loanSelect.value) : null) : null;
      
      if (!name || amount <= 0) return;
      
      appData.payments.push({ name, amount, linkedLoan });
      saveData(appData);
      render();
    }
    
    function removeSetupPayment(index) {
      appData.payments.splice(index, 1);
      saveData(appData);
      render();
    }

    function addLoan() {
      const name = document.getElementById('new-loan-name').value.trim();
      const balance = parseFloat(document.getElementById('new-loan-balance').value) || 0;
      
      if (!name) return;
      
      appData.loans.push({ name, balance, linkedPayment: null });
      saveData(appData);
      render();
    }

    function removeLoan(index) {
      appData.loans.splice(index, 1);
      saveData(appData);
      render();
    }

    function completeSetup() {
      appData.initialized = true;
      saveData(appData);
      render();
    }
    
    function completeFreshSetup() {
      const paycheck = appData.paycheck;
      
      // Set dates
      appData.paycheckDate = new Date().toISOString();
      appData.nextPayday = getNextPayday(new Date(new Date().setDate(new Date().getDate() + 1))).toISOString();
      
      // Add savings percentages to balances
      appData.savingsCategories.forEach(cat => {
        cat.balance += (cat.percentage || 0) / 100 * paycheck;
      });
      
      // Calculate checking (what's left after savings and payments)
      const totalSavings = appData.savingsCategories.reduce((sum, cat) => sum + ((cat.percentage || 0) / 100 * paycheck), 0);
      const totalPayments = appData.payments.reduce((sum, p) => sum + p.amount, 0);
      appData.checking = paycheck - totalSavings - totalPayments;
      appData.originalSpendable = appData.checking; // Store for budget calculations
      
      // Subtract payments from linked loans
      appData.payments.forEach(payment => {
        if (payment.linkedLoan !== null && appData.loans[payment.linkedLoan]) {
          appData.loans[payment.linkedLoan].balance -= payment.amount;
          if (appData.loans[payment.linkedLoan].balance < 0) {
            appData.loans[payment.linkedLoan].balance = 0;
          }
        }
      });
      
      appData.initialized = true;
      saveData(appData);
      render();
    }

    // ==================== PAYDAY FLOW ====================
    let paydayStep = 1;
    let tempPaydayData = {};

        </div>
        
        <div class="step-indicator">
          ${Array(steps).fill(0).map((_, i) => `
            <div class="step-dot ${i + 1 === paydayStep ? 'active' : i + 1 < paydayStep ? 'completed' : ''}"></div>
          `).join('')}
        </div>
      `;

        html += `
          <div class="card">
            <h2>How much did you get paid?</h2>

            </p>
            
            ${appData.savingsCategories.map((cat, i) => `

                <label>${cat.name} (Current: ${formatCurrency(cat.balance)})</label>

                    <input type="number" class="savings-percent" data-index="${i}"

                  <span style="color: var(--accent); font-weight: 500; min-width: 100px; text-align: right;">

                </div>
              </div>
            `).join('')}
            
            ${appData.savingsCategories.length === 0 ? `
              <p style="color: var(--text-muted); text-align: center; padding: 20px;">
                No savings categories set up yet. You can add them in settings.
              </p>
            ` : ''}
            
            <div class="summary-box">
              <h4>Total to Savings</h4>
              <div class="amount" id="total-savings">${formatCurrency(0)}</div>
            </div>
            
            <div class="btn-group">
              <button class="btn btn-secondary" onclick="prevPaydayStep()">Back</button>
              <button class="btn btn-primary" onclick="nextPaydayStep()">Continue</button>
            </div>
          </div>
        `;
      } else if (paydayStep === 3) {
        const lastPayments = appData.payments || [];
        
        html += `
          <div class="card">
            <h2>Payments & Subscriptions</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
              Review and update your monthly payments
            </p>
            
            <div id="payments-list">
              ${(tempPaydayData.payments || lastPayments).map((payment, i) => `
                <div class="list-item">
                  <div class="list-item-info">
                    <div class="list-item-name">${payment.name}</div>
                    ${payment.linkedLoan !== null ? `
                      <div class="list-item-meta">Linked to: ${appData.loans[payment.linkedLoan]?.name || 'Unknown Loan'}</div>
                    ` : ''}
                  </div>
                  <div class="list-item-amount">${formatCurrency(payment.amount)}</div>
                  <div class="list-item-actions">
                    <button class="btn btn-danger" onclick="removePayment(${i})">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
            
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);">
              <div class="form-group">
                <input type="text" id="new-payment-name" placeholder="Payment name">
              </div>
              <div class="form-group">
                <div class="input-prefix">
                  <input type="number" id="new-payment-amount" step="0.01" min="0" placeholder="Amount">
                </div>
              </div>
              ${appData.loans.length > 0 ? `
                <div class="form-group">
                  <label>Link to loan (optional)</label>
                  <select id="new-payment-loan">
                    <option value="">None</option>
                    ${appData.loans.map((loan, i) => `
                      <option value="${i}">${loan.name}</option>
                    `).join('')}
                  </select>
                </div>
              ` : ''}
              <button class="btn btn-secondary btn-block" onclick="addPayment()">Add Payment</button>
            </div>
            
            <div class="summary-box">
              <h4>Total Payments</h4>
              <div class="amount" id="total-payments">${formatCurrency((tempPaydayData.payments || lastPayments).reduce((sum, p) => sum + p.amount, 0))}</div>
            </div>
            
            <div class="btn-group">
              <button class="btn btn-secondary" onclick="prevPaydayStep()">Back</button>
              <button class="btn btn-primary" onclick="nextPaydayStep()">Continue</button>
            </div>
          </div>
        `;
      } else if (paydayStep === 4) {
        const paycheck = tempPaydayData.paycheck || 0;
        const totalSavings = appData.savingsCategories.reduce((sum, cat, i) => {
          return sum + ((tempPaydayData.savingsPercentages?.[i] || 0) / 100 * paycheck);
        }, 0);
        const totalPayments = (tempPaydayData.payments || []).reduce((sum, p) => sum + p.amount, 0);
        const afterspend = paycheck - totalSavings - totalPayments;
        const nextPayday = getNextPayday(new Date(new Date().setDate(new Date().getDate() + 1)));
        const weeks = getWeeksBetween(new Date(), nextPayday);
        const weeklyBudget = (afterspend - appData.emergencyBuffer) / weeks.length;
        
        html += `
          <div class="card">
            <h2>Your Budget Summary</h2>
            
            <div class="stats-row">
              <span class="stats-label">Paycheck</span>
              <span class="stats-value">${formatCurrency(paycheck)}</span>
            </div>
            
            <div class="stats-row">
              <span class="stats-label">To Savings</span>
              <span class="stats-value negative">-${formatCurrency(totalSavings)}</span>
            </div>
            
            <div class="stats-row">
              <span class="stats-label">Payments/Subscriptions</span>
              <span class="stats-value negative">-${formatCurrency(totalPayments)}</span>
            </div>
            
            <div class="stats-row">
              <span class="stats-label">Emergency Buffer</span>
              <span class="stats-value negative">-${formatCurrency(appData.emergencyBuffer)}</span>
            </div>
            
            <div class="stats-row" style="font-weight: bold; border-top: 2px solid var(--border); padding-top: 16px;">
              <span class="stats-label">Spendable Amount</span>
              <span class="stats-value ${afterspend - appData.emergencyBuffer >= 0 ? 'positive' : 'negative'}">${formatCurrency(afterspend - appData.emergencyBuffer)}</span>
            </div>
            
            <div class="summary-box" style="margin-top: 24px;">
              <h4>Weekly Budget (${weeks.length} weeks until next payday)</h4>
              <div class="amount">${formatCurrency(weeklyBudget)}</div>
            </div>
            
            <div style="margin-top: 20px; padding: 16px; background: var(--bg); border-radius: 8px;">
              <h4 style="margin-bottom: 12px; font-size: 0.9rem;">💡 Transfer these amounts to savings:</h4>
              ${appData.savingsCategories.map((cat, i) => {
                const amount = (tempPaydayData.savingsPercentages?.[i] || 0) / 100 * paycheck;
                return `
                  <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border);">
                    <span>${cat.name}</span>
                    <strong style="color: var(--accent);">${formatCurrency(amount)}</strong>
                  </div>
                `;
              }).join('')}
            </div>
            
            <div class="btn-group">
              <button class="btn btn-secondary" onclick="prevPaydayStep()">Back</button>
              <button class="btn btn-primary" onclick="completePaydayFlow()">Start Month</button>
            </div>
          </div>
        `;
      }
      
      app.innerHTML = html;
      
      // Add event listeners for savings percentage inputs
      if (paydayStep === 2) {
        document.querySelectorAll('.savings-percent').forEach(input => {
          input.addEventListener('input', updateSavingsTotal);
        });
        updateSavingsTotal();
      }
    }

    function updateSavingsTotal() {
      const paycheck = tempPaydayData.paycheck || 0;
      let total = 0;
      
      document.querySelectorAll('.savings-percent').forEach(input => {
        const percent = parseFloat(input.value) || 0;
        total += (percent / 100) * paycheck;
      });
      
      const totalEl = document.getElementById('total-savings');
      if (totalEl) {
        totalEl.textContent = formatCurrency(total);
      }
    }

    function nextPaydayStep() {
      if (paydayStep === 1) {
        const paycheck = parseFloat(document.getElementById('paycheck-amount').value) || 0;
        if (paycheck <= 0) {
          alert('Please enter your paycheck amount');
          return;
        }
        tempPaydayData.paycheck = paycheck;
      } else if (paydayStep === 2) {
        tempPaydayData.savingsPercentages = [];
        document.querySelectorAll('.savings-percent').forEach(input => {
          tempPaydayData.savingsPercentages.push(parseFloat(input.value) || 0);
        });
      } else if (paydayStep === 3) {
        // Payments are already in tempPaydayData.payments
        if (!tempPaydayData.payments) {
          tempPaydayData.payments = [...appData.payments];
        }
      }
      
      paydayStep++;
      render();
    }

    function prevPaydayStep() {
      paydayStep--;
      render();
    }

    function addPayment() {
      const name = document.getElementById('new-payment-name').value.trim();
      const amount = parseFloat(document.getElementById('new-payment-amount').value) || 0;
      const loanSelect = document.getElementById('new-payment-loan');
      const linkedLoan = loanSelect ? (loanSelect.value !== '' ? parseInt(loanSelect.value) : null) : null;
      
      if (!name || amount <= 0) return;
      
      if (!tempPaydayData.payments) {
        tempPaydayData.payments = [...appData.payments];
      }
      
      tempPaydayData.payments.push({ name, amount, linkedLoan });
      render();
    }

    function removePayment(index) {
      if (!tempPaydayData.payments) {
        tempPaydayData.payments = [...appData.payments];
      }
      tempPaydayData.payments.splice(index, 1);
      render();
    }

    function completePaydayFlow() {
      const paycheck = tempPaydayData.paycheck;
      
      // Update app data
      appData.paycheck = paycheck;
      appData.paycheckDate = new Date().toISOString();
      appData.nextPayday = getNextPayday(new Date(new Date().setDate(new Date().getDate() + 1))).toISOString();
      
      // Update savings categories with new percentages and add to balances
      appData.savingsCategories.forEach((cat, i) => {
        const percent = tempPaydayData.savingsPercentages?.[i] || 0;
        cat.percentage = percent;
        cat.balance += (percent / 100) * paycheck;
      });
      
      // Update payments
      appData.payments = tempPaydayData.payments || appData.payments;
      
      // Subtract payments from linked loans
      appData.payments.forEach(payment => {
        if (payment.linkedLoan !== null && appData.loans[payment.linkedLoan]) {
          appData.loans[payment.linkedLoan].balance -= payment.amount;
          if (appData.loans[payment.linkedLoan].balance < 0) {
            appData.loans[payment.linkedLoan].balance = 0;
          }
        }
      });
      
      // Clear expenses for new period
      appData.expenses = [];
      appData.extraIncome = [];
      
      // Update checking balance
      const totalSavings = appData.savingsCategories.reduce((sum, cat, i) => {
        return sum + ((tempPaydayData.savingsPercentages?.[i] || 0) / 100 * paycheck);
      }, 0);
      const totalPayments = appData.payments.reduce((sum, p) => sum + p.amount, 0);
      appData.checking = paycheck - totalSavings - totalPayments;
      appData.originalSpendable = appData.checking; // Store for budget calculations
      
      saveData(appData);
      
      // Reset payday flow
      paydayStep = 1;
      tempPaydayData = {};
      
      render();
    }

    // ==================== DASHBOARD ====================
    function renderDashboard() {
      const weeklyBudgets = calculateWeeklyBudgets();
      const currentWeekIndex = getCurrentWeekIndex();
      const currentWeek = weeklyBudgets[currentWeekIndex] || { budget: 0, spent: 0, remaining: 0 };
      const spentPercent = currentWeek.budget > 0 ? (currentWeek.spent / currentWeek.budget) * 100 : 0;
      const isOverBudget = currentWeek.remaining < 0;
      
      let progressClass = '';
      if (spentPercent >= 100) progressClass = 'danger';
      else if (spentPercent >= 75) progressClass = 'warning';
      
      const today = new Date();
      
      let html = `
        <div class="header">
          <h1>💰 Based Budgeting</h1>
          <p class="date">${today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
        </div>
      `;
      
      if (isOverBudget) {
        html += `
          <div class="alert alert-danger">
            ⚠️ You're over budget this week! Try to hold off on spending.
          </div>
        `;
      } else if (spentPercent >= 75) {
        html += `
          <div class="alert alert-warning">
            ⚡ You've used ${Math.round(spentPercent)}% of this week's budget. Spend carefully!
          </div>
        `;
      }
      
      html += `
        <div class="card">
          <h2>This Week's Budget</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">
            ${currentWeek.start ? formatDateRange(currentWeek.start, currentWeek.end) : 'No budget set'}
          </p>
          
          <div class="budget-display">
            <div class="budget-amount ${isOverBudget ? 'over' : ''}">${formatCurrency(Math.abs(currentWeek.remaining))}</div>
            <div class="budget-label">${isOverBudget ? 'Over Budget' : 'Remaining'}</div>
          </div>
          
          <div class="progress-bar">
            <div class="progress-fill ${progressClass}" style="width: ${Math.min(spentPercent, 100)}%"></div>
          </div>
          
          <div class="stats-row">
            <span class="stats-label">Weekly Budget</span>
            <span class="stats-value">${formatCurrency(currentWeek.budget)}</span>
          </div>
          <div class="stats-row">
            <span class="stats-label">Spent</span>
            <span class="stats-value negative">-${formatCurrency(currentWeek.spent)}</span>
          </div>
          
          <div class="btn-group">
            <button class="btn btn-primary btn-block" onclick="openModal('addExpense')">+ Add Expense</button>
          </div>
        </div>
        
        <div class="card">
          <h2>Quick Actions</h2>
          <div class="btn-group" style="flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="openModal('addIncome')" style="flex: 1 1 45%;">+ Add Income</button>
            <button class="btn btn-secondary" onclick="openModal('savingsExpense')" style="flex: 1 1 45%;">Buy from Savings</button>
          </div>
        </div>
        
        <div class="card">
          <h2>Month Overview</h2>
          
          <div class="stats-row">
            <span class="stats-label">Emergency Buffer</span>
            <span class="stats-value">${formatCurrency(appData.emergencyBuffer)}</span>
          </div>
          <div class="stats-row">
            <span class="stats-label">Next Payday</span>
            <span class="stats-value">${appData.nextPayday ? formatDate(appData.nextPayday) : 'Not set'}</span>
          </div>
          <div class="stats-row">
            <span class="stats-label">Weeks Remaining</span>
            <span class="stats-value">${weeklyBudgets.length - currentWeekIndex}</span>
          </div>
          
          <h3 style="margin-top: 20px;">Weekly Breakdown</h3>
          ${weeklyBudgets.map((week, i) => {
            const isCurrent = i === currentWeekIndex;
            const isPast = i < currentWeekIndex;
            return `
              <div class="list-item" style="${isCurrent ? 'border: 2px solid var(--accent);' : ''} ${isPast ? 'opacity: 0.6;' : ''}">
                <div class="list-item-info">
                  <div class="list-item-name">${isCurrent ? '→ ' : ''}Week ${i + 1}</div>
                  <div class="list-item-meta">${formatDateRange(week.start, week.end)}</div>

              </div>

      app.innerHTML = html;
      
      if (modalOpen) {
        renderModal();
      }

              <div class="list-item-info">
                <div class="list-item-name">${expense.name}</div>
                <div class="list-item-meta">
                  ${formatDate(expense.date)} ·

      app.innerHTML = html;
      
      if (modalOpen) {
        renderModal();
      }
    }

    function deleteExpense(index) {
      if (confirm('Delete this expense?')) {
        const expense = appData.expenses[index];
        
        // If it was from savings, add the amount back
        if (expense.fromSavings) {
          const savingsCat = appData.savingsCategories.find(c => c.name === expense.fromSavings);
          if (savingsCat) {
            savingsCat.balance += expense.amount;
          }
        }
        
        appData.expenses.splice(index, 1);
        saveData(appData);
        render();
      }
    }

                <div class="loan-header">
                  <span class="loan-name">${loan.name}</span>
                  <span class="loan-balance">${formatCurrency(loan.balance)}</span>
                </div>
                <div class="loan-meta">Remaining balance</div>
              </div>
            `).join('')}
            
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);">
              <h3 style="margin-bottom: 12px;">Make a Payment</h3>
              <div class="form-group">
                <label>Select Loan</label>
                <select id="loan-payment-select">
                  ${appData.loans.map((loan, i) => `
                    <option value="${i}">${loan.name} (${formatCurrency(loan.balance)})</option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Payment Amount</label>
                <div class="input-prefix">
                  <input type="number" id="loan-payment-amount" step="0.01" min="0" placeholder="0.00">
                </div>
              </div>
              <button class="btn btn-primary btn-block" onclick="makeLoanPayment()">Pay on Loan</button>
            </div>
          </div>
        ` : ''}
        
        <div class="card">
          <h2>Add to Savings</h2>
          <div class="form-group">
            <label>Select Category</label>
            <select id="add-savings-category">
              ${appData.savingsCategories.map((cat, i) => `
                <option value="${i}">${cat.name}</option>
              `).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Amount</label>
            <div class="input-prefix">
              <input type="number" id="add-savings-amount" step="0.01" min="0" placeholder="0.00">
            </div>
          </div>
          <button class="btn btn-primary btn-block" onclick="addToSavings()">Add to Savings</button>
        </div>
        
        <div class="card">
          <h2>Withdraw from Savings</h2>
          <div class="form-group">
            <label>Select Category</label>
            <select id="withdraw-savings-category">
              ${appData.savingsCategories.map((cat, i) => `
                <option value="${i}">${cat.name} (${formatCurrency(cat.balance)})</option>
              `).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Amount</label>
            <div class="input-prefix">
              <input type="number" id="withdraw-savings-amount" step="0.01" min="0" placeholder="0.00">
            </div>
          </div>
          <button class="btn btn-secondary btn-block" onclick="withdrawFromSavings()">Withdraw</button>
        </div>
      `;
      
      app.innerHTML = html;
    }

    function addToSavings() {
      const categoryIndex = parseInt(document.getElementById('add-savings-category').value);
      const amount = parseFloat(document.getElementById('add-savings-amount').value) || 0;
      
      if (amount <= 0) return;
      
      appData.savingsCategories[categoryIndex].balance += amount;
      saveData(appData);
      render();
    }

    function withdrawFromSavings() {
      const categoryIndex = parseInt(document.getElementById('withdraw-savings-category').value);
      const amount = parseFloat(document.getElementById('withdraw-savings-amount').value) || 0;
      
      if (amount <= 0) return;
      if (amount > appData.savingsCategories[categoryIndex].balance) {
        alert('Not enough in savings!');
        return;
      }
      
      appData.savingsCategories[categoryIndex].balance -= amount;
      appData.checking += amount;
      saveData(appData);
      render();
    }
    
    function makeLoanPayment() {
      const loanIndex = parseInt(document.getElementById('loan-payment-select').value);
      const amount = parseFloat(document.getElementById('loan-payment-amount').value) || 0;
      
      if (amount <= 0) {
        alert('Please enter an amount');
        return;
      }
      
      appData.loans[loanIndex].balance -= amount;
      if (appData.loans[loanIndex].balance < 0) {
        appData.loans[loanIndex].balance = 0;
      }
      
      saveData(appData);
      render();
    }

    // ==================== SETTINGS VIEW ====================
    function renderSettings() {
      let html = `
        <div class="header">
          <h1>Settings</h1>
          <p class="date">Manage your budget</p>
        </div>
        
        <div class="card">
          <h2>Savings Categories</h2>
          ${appData.savingsCategories.map((cat, i) => `
            <div class="list-item">
              <div class="list-item-info">
                <div class="list-item-name">${cat.name}</div>
                <div class="list-item-meta">${formatCurrency(cat.balance)}</div>
              </div>
              <button class="btn btn-danger" onclick="removeSavingsCategorySetting(${i})">Remove</button>
            </div>
          `).join('')}
          
          <div class="inline-form" style="margin-top: 16px;">
            <input type="text" id="settings-new-savings" placeholder="New category name">
            <button class="btn btn-secondary" onclick="addSavingsCategorySetting()">Add</button>
          </div>
        </div>
        
        <div class="card">
          <h2>Expense Categories</h2>
          ${appData.expenseCategories.map((cat, i) => `
            <div class="list-item">
              <span>${cat}</span>
              <button class="btn btn-danger" onclick="removeExpenseCategory(${i})">Remove</button>
            </div>
          `).join('')}
          
          <div class="inline-form" style="margin-top: 16px;">
            <input type="text" id="settings-new-expense-cat" placeholder="New category">
            <button class="btn btn-secondary" onclick="addExpenseCategory()">Add</button>
          </div>
        </div>
        
        <div class="card">
          <h2>Loans</h2>
          ${appData.loans.map((loan, i) => `
            <div class="loan-card">
              <div class="loan-header">
                <span class="loan-name">${loan.name}</span>
                <span class="loan-balance">${formatCurrency(loan.balance)}</span>
              </div>
              <button class="btn btn-danger" style="margin-top: 8px;" onclick="removeLoanSetting(${i})">Remove</button>
            </div>
          `).join('')}
          
          <div class="inline-form" style="margin-top: 16px;">
            <input type="text" id="settings-new-loan-name" placeholder="Loan name">
            <div class="inline-form-row">
              <div class="input-prefix" style="flex: 1;">
                <input type="number" id="settings-new-loan-balance" step="0.01" min="0" placeholder="Balance">
              </div>
              <button class="btn btn-secondary" onclick="addLoanSetting()">Add</button>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h2>Appearance</h2>
          <div class="list-item" style="cursor: pointer;" onclick="toggleTheme()">
            <div class="list-item-info">
              <div class="list-item-name">Dark Mode</div>
              <div class="list-item-meta">Toggle light/dark theme</div>
            </div>
            <div style="font-size: 1.5rem;">${document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙'}</div>
          </div>
        </div>
        
        <div class="card">
          <h2>Emergency Buffer</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">
            Amount to keep as a buffer each month
          </p>
          <div class="form-group">
            <div class="input-prefix">
              <input type="number" id="emergency-buffer" step="1" min="0" value="${appData.emergencyBuffer}">
            </div>
          </div>
          <button class="btn btn-secondary btn-block" onclick="updateEmergencyBuffer()">Update</button>
        </div>
        
        <div class="card">
          <h2>⚠️ Danger Zone</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">
            Reset all data and start fresh
          </p>
          <button class="btn btn-danger btn-block" onclick="resetAllData()">Reset Everything</button>
        </div>
      `;
      
      app.innerHTML = html;
    }

    function removeSavingsCategorySetting(index) {
      if (confirm(`Remove "${appData.savingsCategories[index].name}"? This will delete the category and its balance.`)) {
        appData.savingsCategories.splice(index, 1);
        saveData(appData);
        render();
      }
    }

    function addSavingsCategorySetting() {
      const name = document.getElementById('settings-new-savings').value.trim();
      if (!name) return;
      
      appData.savingsCategories.push({ name, balance: 0, percentage: 0 });
      saveData(appData);
      render();
    }

    function removeExpenseCategory(index) {
      appData.expenseCategories.splice(index, 1);
      saveData(appData);
      render();
    }

    function addExpenseCategory() {
      const name = document.getElementById('settings-new-expense-cat').value.trim();
      if (!name) return;
      
      appData.expenseCategories.push(name);
      saveData(appData);
      render();
    }

    function removeLoanSetting(index) {
      if (confirm(`Remove "${appData.loans[index].name}"?`)) {
        // Remove linked payment references
        appData.payments.forEach(p => {
          if (p.linkedLoan === index) p.linkedLoan = null;
          else if (p.linkedLoan > index) p.linkedLoan--;
        });
        
        appData.loans.splice(index, 1);
        saveData(appData);
        render();
      }
    }

    function addLoanSetting() {
      const name = document.getElementById('settings-new-loan-name').value.trim();
      const balance = parseFloat(document.getElementById('settings-new-loan-balance').value) || 0;
      
      if (!name) return;
      
      appData.loans.push({ name, balance, linkedPayment: null });
      saveData(appData);
      render();
    }

    function updateEmergencyBuffer() {
      const buffer = parseFloat(document.getElementById('emergency-buffer').value) || 100;
      appData.emergencyBuffer = buffer;
      saveData(appData);
      alert('Emergency buffer updated!');
    }

    function resetAllData() {
      if (confirm('Are you sure? This will delete ALL your data and cannot be undone.')) {
        if (confirm('Really sure? Type OK to confirm.')) {
          localStorage.removeItem(STORAGE_KEY);
          appData = { ...defaultData };
          setupStep = 1;
          setupMode = null;
          paydayStep = 1;
          tempPaydayData = {};
          render();
        }
      }
    }

    // ==================== MODALS ====================
    function openModal(type) {
      modalOpen = type;
      render();
    }

    function closeModal() {
      modalOpen = null;
      render();
    }

    function renderModal() {
      let modalHtml = '';
      
      if (modalOpen === 'addExpense') {
        modalHtml = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
              <h2>Add Expense</h2>
              
              <div class="form-group">
                <label>What did you buy?</label>
                <input type="text" id="expense-name" placeholder="e.g., Lunch at Chipotle">
              </div>
              
              <div class="form-group">
                <label>Amount</label>
                <div class="input-prefix">
                  <input type="number" id="expense-amount" step="0.01" min="0" placeholder="0.00">
                </div>
              </div>
              
              <div class="form-group">
                <label>Category</label>
                <select id="expense-category">
                  ${appData.expenseCategories.map(cat => `
                    <option value="${cat}">${cat}</option>
                  `).join('')}
                </select>
              </div>
              
              <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveExpense()">Add</button>
              </div>
            </div>
          </div>
        `;
      } else if (modalOpen === 'addIncome') {
        modalHtml = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
              <h2>Add Extra Income</h2>
              <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                This will be distributed across remaining weeks
              </p>
              
              <div class="form-group">
                <label>Description</label>
                <input type="text" id="income-name" placeholder="e.g., Birthday money from Grandma">
              </div>
              
              <div class="form-group">
                <label>Amount</label>
                <div class="input-prefix">
                  <input type="number" id="income-amount" step="0.01" min="0" placeholder="0.00">
                </div>
              </div>
              
              <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveIncome()">Add</button>
              </div>
            </div>
          </div>
        `;
      } else if (modalOpen === 'savingsExpense') {
        modalHtml = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
              <h2>Buy from Savings</h2>
              <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                This won't affect your weekly budget
              </p>
              
              <div class="form-group">
                <label>What did you buy?</label>
                <input type="text" id="savings-expense-name" placeholder="e.g., 3D Printer">
              </div>
              
              <div class="form-group">
                <label>Amount</label>
                <div class="input-prefix">
                  <input type="number" id="savings-expense-amount" step="0.01" min="0" placeholder="0.00">
                </div>
              </div>
              
              <div class="form-group">
                <label>From which savings?</label>
                <select id="savings-expense-category">
                  ${appData.savingsCategories.map(cat => `
                    <option value="${cat.name}">${cat.name} (${formatCurrency(cat.balance)})</option>
                  `).join('')}
                </select>
              </div>
              
              <div class="form-group">
                <label>Expense Category</label>
                <select id="savings-expense-type">
                  ${appData.expenseCategories.map(cat => `
                    <option value="${cat}">${cat}</option>
                  `).join('')}
                </select>
              </div>
              
              <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSavingsExpense()">Add</button>
              </div>
            </div>
          </div>
        `;
      }
      
      app.insertAdjacentHTML('beforeend', modalHtml);
    }

    function saveExpense() {
      const name = document.getElementById('expense-name').value.trim();
      const amount = parseFloat(document.getElementById('expense-amount').value) || 0;
      const category = document.getElementById('expense-category').value;
      
      if (!name || amount <= 0) {
        alert('Please enter a name and amount');
        return;
      }
      
      appData.expenses.push({
        name,
        amount,
        category,
        date: new Date().toISOString(),
        fromSavings: null
      });
      
      // Don't modify checking here - budget calculations use expense tracking
      
      saveData(appData);
      closeModal();
    }

    function saveIncome() {
      const name = document.getElementById('income-name').value.trim();
      const amount = parseFloat(document.getElementById('income-amount').value) || 0;
      
      if (!name || amount <= 0) {
        alert('Please enter a description and amount');
        return;
      }
      
      appData.extraIncome.push({
        name,
        amount,
        date: new Date().toISOString()
      });
      
      // Don't modify checking here - budget calculations use extraIncome tracking
      
      saveData(appData);
      closeModal();
    }

    function saveSavingsExpense() {
      const name = document.getElementById('savings-expense-name').value.trim();
      const amount = parseFloat(document.getElementById('savings-expense-amount').value) || 0;
      const fromSavings = document.getElementById('savings-expense-category').value;
      const category = document.getElementById('savings-expense-type').value;
      
      if (!name || amount <= 0) {
        alert('Please enter a name and amount');
        return;
      }
      
      // Find the savings category and check balance
      const savingsCat = appData.savingsCategories.find(c => c.name === fromSavings);
      if (!savingsCat || savingsCat.balance < amount) {
        alert('Not enough in that savings category!');
        return;
      }
      
      // Deduct from savings
      savingsCat.balance -= amount;
      
      // Add expense (marked as from savings so it doesn't affect weekly budget)
      appData.expenses.push({
        name,
        amount,
        category,
        date: new Date().toISOString(),
        fromSavings
      });
      
      saveData(appData);
      closeModal();
    }

    // ==================== NAVIGATION ====================
    nav.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-view]');
      if (btn) {
        currentView = btn.dataset.view;
        render();
      }
    });

    // ==================== THEME ====================
    function loadTheme() {
      const savedTheme = localStorage.getItem('budgetAppTheme');
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }
    
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('budgetAppTheme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('budgetAppTheme', 'light');
      }
      render();
    }

    // ==================== PWA SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }

    // ==================== INITIALIZE ====================
    loadTheme();
    render();
  </script>
</body>
</html>
